# OpenOCD configuration for Core.ST.H5 tiles (STM32H523)
#
# STM32H523 is Cortex-M33 with TrustZone.
# Flash: 0x08000000, 512 KB.  RAM: 0x20000000, 272 KB.
#
# Probe: ST-Link by default. For the CoreProbe (CMSIS-DAP), set PROBE first:
#   openocd -c "set PROBE coreprobe" -f sdk/debug/stm32h5.cfg ...
# The CoreProbe does not wire NRST here, so every reset is SYSRESETREQ.
#
# Flash programming needs an OpenOCD with an STM32H5 flash driver. Release
# 0.12.0 has none (its stm32h7x driver probes the H7 IDCODE at 0x5C001000 and
# fails); ST's fork, shipped with STM32CubeIDE, has "stm32h5x". Without one,
# this config still attaches, halts, reads and writes memory, and debugs.
# probe-rs (make flash-coreprobe) flashes the H5 either way.

if {![info exists PROBE]} { set PROBE stlink }
if {$PROBE eq "coreprobe"} {
    adapter driver cmsis-dap
    transport select swd
} else {
    source [find interface/stlink.cfg]
    transport select hla_swd
}
adapter speed 3300
reset_config none

source [find target/swj-dp.tcl]
source [find mem_helper.tcl]

set _CHIPNAME stm32h523
set _ENDIAN   little

# SWD DPIDR (H523 reports 0x6ba02477; the H56x reports 0x0be12477)
set _CPUTAPID 0x6ba02477

swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf \
    -expected-id $_CPUTAPID

dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

# The core is behind AP1 (AHB-AP); AP0 is the debug APB (DBGMCU).
target create $_CHIPNAME.cpu cortex_m \
    -endian $_ENDIAN \
    -dap   $_CHIPNAME.dap

$_CHIPNAME.cpu configure \
    -work-area-phys 0x20000000 \
    -work-area-size 0x8000 \
    -work-area-backup 0

# The M33 has no VECTRESET; say so rather than have OpenOCD warn and fall back.
if {![using_hla]} { cortex_m reset_config sysresetreq }

if {[catch {flash bank $_CHIPNAME.flash stm32h5x 0x08000000 0 0 0 $_CHIPNAME.cpu}]} {
    echo "stm32h5.cfg: this OpenOCD has no STM32H5 flash driver; debug only (see the header)"
}

$_CHIPNAME.cpu configure -event reset-start {
    adapter speed 500
}

$_CHIPNAME.cpu configure -event reset-init {
    adapter speed 3300
}

$_CHIPNAME.cpu configure -event examine-end {
    # DBGMCU through the core's AP (AP1) is at the CPU address 0x44024000.
    # RM0481 gives 0xE00E4000 "for the debugger", but that is AP0's view;
    # through AP1 0xE00E4000 reads as zero and ignores writes (bench,
    # 2026-09-26), so the old writes here did nothing.
    # DBGMCU_CR: DBG_STOP (bit 1) | DBG_STANDBY (bit 2); bit 0 is reserved.
    mmw 0x44024004 0x00000006 0
    # DBGMCU_APB1LFZR: freeze WWDG (bit 11) and IWDG (bit 12) on halt.
    mmw 0x44024008 0x00001800 0
}
