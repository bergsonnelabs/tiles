# OpenOCD configuration for Core.ST.W5 tiles (STM32WBA55, ST-Link)
#
# STM32WBA55 is Cortex-M33 with TrustZone — same DAP IDCODE and
# flash controller family as STM32U5x (stm32u5x flash driver).
# Flash: 0x08000000, 1 MB.  RAM: 0x20000000, 96 KB.

source [find interface/stlink.cfg]
transport select hla_swd
adapter speed 3300

source [find target/swj-dp.tcl]
source [find mem_helper.tcl]

set _CHIPNAME stm32wba55
set _ENDIAN   little

# Cortex-M33 SWD IDCODE
set _CPUTAPID 0x0be12477

swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf \
    -expected-id $_CPUTAPID

dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

target create $_CHIPNAME.cpu cortex_m \
    -endian $_ENDIAN \
    -dap   $_CHIPNAME.dap

$_CHIPNAME.cpu configure \
    -work-area-phys 0x20000000 \
    -work-area-size 0x8000 \
    -work-area-backup 0

# STM32WBA55 flash controller uses the stm32l4x driver (same as WB/L5/U5 families).
# Size 0 = let OpenOCD probe the actual flash size.
flash bank $_CHIPNAME.flash stm32l4x 0x08000000 0 0 0 $_CHIPNAME.cpu

# Conservative reset-start speed; bump after clock-up.
$_CHIPNAME.cpu configure -event reset-start {
    adapter speed 500
}

$_CHIPNAME.cpu configure -event reset-init {
    # HSE is already running at 32 MHz (coregen default for Core.ST.W5).
    adapter speed 3300
}

$_CHIPNAME.cpu configure -event examine-end {
    # Keep debug active during low-power modes (DBGMCU_SCR).
    # RM0493: DBGMCU is at 0xE0044000 for the debugger — NOT 0xE0042000, which
    # is the CTI block on this part (these two lines were copied from the H5
    # config and had been writing into CoreSight cross-trigger space).
    # DBGMCU_SCR: DBG_STOP (bit 1) | DBG_STANDBY (bit 2); bit 0 is reserved
    # (RM0493 §43.12.7).
    mmw 0xE0044004 0x00000006 0
    # Freeze WWDG + IWDG on halt (DBGMCU_APB1LFZR bits 11/12).
    mmw 0xE0044008 0x00001800 0
}

reset_config srst_nogate
