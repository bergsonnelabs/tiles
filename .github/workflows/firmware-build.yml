name: firmware-build

# Compiles firmware for every Core on every PR that touches the SDK, the
# generators, or the starter templates.
#
# Why this exists: `core_watchdog.h` includes `hal_dfu.h`, which defined its
# reserved-SRAM addresses only for the USB-capable parts while leaving the DFU
# entry points unguarded — so including it on a WBA55 was a hard compile error,
# and EVERY Core.ST.W5 project Studio generated failed to build. Nothing in CI
# compiled firmware, so it shipped. A header that builds on one MCU family and
# not another is exactly the class of break this job catches.

on:
  pull_request:
    paths:
      - 'sdk/**'
      - 'drivers/**'
      - 'templates/**'
      - 'tools/coregen/**'
      - 'tools/test_ble_contract.py'
      - 'tests/val-watchdog/**'
      - 'tests/val-scope/**'
      - 'tools/test_core_scope*'
      - 'tools/scope_decode.py'
      - 'docs/scope-protocol.md'
      - 'tests/ble-*/**'
      - 'tests/val-ble*/**'
      - 'tests/val-guard-ble/**'
      - 'Makefile'
      - '.github/workflows/firmware-build.yml'
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core: [Core.ST.L0.1, Core.ST.L4.1, Core.ST.W5, Core.ST.H5.1]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install arm-none-eabi-gcc
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.2.Rel1'

      - name: Install Jinja2 (coregen)
        run: python3 -m pip install --quiet jinja2

      # Exercises the Core watchdog API on every Core. This is the regression pin
      # for the hal_dfu.h break described above.
      - name: val-watchdog (${{ matrix.core }})
        run: make -C tests/val-watchdog TILE=${{ matrix.core }}

      # The Scope picks its link per Core at compile time (USB / none here;
      # Bluetooth is built in the ble job), so it has to build on all of them,
      # and again compiled out.
      - name: val-scope (${{ matrix.core }})
        run: |
          make -C tests/val-scope TILE=${{ matrix.core }}
          make -C tests/val-scope clean
          make -C tests/val-scope TILE=${{ matrix.core }} SCOPE_ENABLED=0

      # The starter templates are what a new user's first build actually runs.
      - name: starter template (${{ matrix.core }})
        run: |
          case "${{ matrix.core }}" in
            Core.ST.L0.1) DIR=core-st-l0-1 ;;
            Core.ST.L4.1) DIR=core-st-l4-1 ;;
            Core.ST.W5)   DIR=core-st-w5   ;;
            Core.ST.H5.1) DIR=core-st-h5-1 ;;
          esac
          make -C "templates/$DIR" SDK_ROOT="$GITHUB_WORKSPACE"

  # The BLE reference projects. These are what people are pointed at to learn
  # the API, and nothing built them — ble-test had been broken for months by a
  # subdirectory the build never globbed plus a long-removed core_ble_init()
  # argument. Core.ST.W5 only; BLE does not exist on the other Cores.
  ble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install arm-none-eabi-gcc
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.2.Rel1'

      - name: Install Jinja2 (coregen)
        run: python3 -m pip install --quiet jinja2

      # Every way a BLE contract can be wrong. Lives here rather than beside the
      # other Python tests because it imports coregen, which needs Jinja2, and
      # this is the job that already has it.
      - name: BLE contract binding tests
        run: python3 tools/test_ble_contract.py

      # core_scope compiled with the host cc against a scripted link, checked
      # by the reference decoder: framing, every type, drops, BLE batching, and
      # the example frames printed in docs/scope-protocol.md.
      - name: Scope protocol tests
        run: python3 tools/test_core_scope.py

      # These take BLE_ENABLED from their config.json "ble" block, so they also
      # exercise the config-driven path Studio and the build service rely on.
      - name: Build the BLE projects
        run: |
          for p in ble-test ble-missing ble-beacon ble-contract val-ble val-ble-temp val-ble-scope; do
            echo "::group::$p"
            make -C "tests/$p"
            echo "::endgroup::"
          done

      # val-guard-ble is a NEGATIVE test: core_ble.h must #error on a Core with
      # no radio. If it ever compiles, the availability guard has broken.
      - name: val-guard-ble must NOT compile
        run: |
          if make -C tests/val-guard-ble > /tmp/guard.log 2>&1; then
            echo "::error::val-guard-ble compiled — the BLE availability guard is broken"
            exit 1
          fi
          grep -q 'BLE is only available on Core.ST.W5' /tmp/guard.log || {
            echo "::error::val-guard-ble failed, but not on the availability #error:"
            tail -20 /tmp/guard.log
            exit 1
          }
          echo "val-guard-ble correctly refused to compile."
