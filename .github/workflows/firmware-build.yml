name: firmware-build

# Compiles firmware for every Core on every PR that touches the SDK, the
# generators, the starter templates, or a Core definition (a Core JSON change
# or DB rename re-runs the builds rather than passing as "skipped").
#
# Why this exists: `core_watchdog.h` includes `hal_dfu.h`, which defined its
# reserved-SRAM addresses only for the USB-capable parts while leaving the DFU
# entry points unguarded — so including it on a WBA55 was a hard compile error,
# and EVERY Core.ST.W5 project Studio generated failed to build. Nothing in CI
# compiled firmware, so it shipped. A header that builds on one MCU family and
# not another is exactly the class of break this job catches.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Always reports (see design note below) so this workflow can be a required
  # check on every PR, even ones that don't touch firmware paths. It figures
  # out whether the heavy jobs below actually need to run.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin "$BASE_REF"
          CHANGED="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          echo "Changed files:"
          echo "$CHANGED"

          # Faithful mirror of this workflow's old pull_request.paths filter.
          PATTERNS=(
            'sdk/**'
            'drivers/**'
            'templates/**'
            'tools/coregen/**'
            'definitions/Core-*'
            'definitions/mCore-*'
            'tools/test_ble_contract.py'
            'tools/test_coregen_spi_cs.py'
            'tests/val-watchdog/**'
            'tests/val-scope/**'
            'tools/test_core_scope*'
            'tools/scope_decode.py'
            'docs/scope-protocol.md'
            'tools/serial_update.py'
            'tools/test_serial_update.py'
            'tools/gen_serial_update_blob.py'
            'docs/serial-update-protocol.md'
            'tests/ble-*/**'
            'tests/val-ble*/**'
            'tests/val-guard-ble/**'
            'tests/host-nvm-sim/**'
            'Makefile'
            '.github/workflows/firmware-build.yml'
          )

          # Glob -> ERE: ** = any depth (incl. /), * = no slash, everything
          # else is escaped and matched literally.
          glob_to_regex() {
            local glob="$1" out="" i=0 c len=${#1}
            while [ "$i" -lt "$len" ]; do
              c="${glob:$i:1}"
              if [ "${glob:$i:2}" = "**" ]; then
                out+=".*"
                i=$((i + 2))
              elif [ "$c" = "*" ]; then
                out+="[^/]*"
                i=$((i + 1))
              else
                case "$c" in
                  '.') out+='\.' ;;
                  '['|']'|'('|')'|'{'|'}'|'^'|'$'|'|'|'\'|'+'|'?')
                    out+="\\$c" ;;
                  *) out+="$c" ;;
                esac
                i=$((i + 1))
              fi
            done
            printf '^%s$' "$out"
          }

          RUN=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            for pat in "${PATTERNS[@]}"; do
              regex="$(glob_to_regex "$pat")"
              if [[ "$file" =~ $regex ]]; then
                echo "match: $file  (pattern: $pat)"
                RUN=true
                break 2
              fi
            done
          done <<< "$CHANGED"

          echo "run=$RUN" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Public names (Core.ST.L4 was Core.ST.L4.1 until the 2026-09 rename).
        # Core.ST.L4.2 is not built here: it won't go to production.
        core: [Core.ST.L0, Core.ST.L4, Core.ST.W5, Core.ST.H5]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install arm-none-eabi-gcc
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.2.Rel1'

      - name: Install Jinja2 (coregen)
        run: python3 -m pip install --quiet jinja2

      # Exercises the Core watchdog API on every Core. This is the regression pin
      # for the hal_dfu.h break described above.
      - name: val-watchdog (${{ matrix.core }})
        run: make -C tests/val-watchdog TILE=${{ matrix.core }}

      # The Scope picks its link per Core at compile time (USB / none here;
      # Bluetooth is built in the ble job), so it has to build on all of them,
      # and again compiled out.
      - name: val-scope (${{ matrix.core }})
        run: |
          make -C tests/val-scope TILE=${{ matrix.core }}
          make -C tests/val-scope clean
          make -C tests/val-scope TILE=${{ matrix.core }} SCOPE_ENABLED=0

      # The starter templates are what a new user's first build actually runs.
      - name: starter template (${{ matrix.core }})
        run: |
          case "${{ matrix.core }}" in
            Core.ST.L0) DIR=core-st-l0 ;;
            Core.ST.L4) DIR=core-st-l4 ;;
            Core.ST.W5) DIR=core-st-w5 ;;
            Core.ST.H5) DIR=core-st-h5 ;;
          esac
          make -C "templates/$DIR" SDK_ROOT="$GITHUB_WORKSPACE"

  # The BLE reference projects. These are what people are pointed at to learn
  # the API, and nothing built them — ble-test had been broken for months by a
  # subdirectory the build never globbed plus a long-removed core_ble_init()
  # argument. Core.ST.W5 only; BLE does not exist on the other Cores.
  ble:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install arm-none-eabi-gcc
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.2.Rel1'

      - name: Install Jinja2 (coregen)
        run: python3 -m pip install --quiet jinja2

      # Every way a BLE contract can be wrong. Lives here rather than beside the
      # other Python tests because it imports coregen, which needs Jinja2, and
      # this is the job that already has it.
      - name: BLE contract binding tests
        run: python3 tools/test_ble_contract.py

      # SPI chip selects: several tiles on one bus, each with its own cs_pad,
      # and every config coregen must refuse (shared pad, shared instance).
      - name: SPI chip-select tests
        run: python3 tools/test_coregen_spi_cs.py

      # core_scope compiled with the host cc against a scripted link, checked
      # by the reference decoder: framing, every type, drops, BLE batching, and
      # the example frames printed in docs/scope-protocol.md.
      - name: Scope protocol tests
        run: python3 tools/test_core_scope.py

      # Serial update: the protocol core (su_core.c, host cc) on a simulated L4
      # flash, driven by the real host client — including a power cut after
      # every frame. Then: the flasher still links with -nostdlib on this
      # toolchain (nothing it runs may live in flash), and the committed blob
      # header was regenerated after the last source change.
      - name: Serial update protocol tests
        run: make -C sdk/serial_update test
      - name: Serial update flasher links standalone
        run: make -C sdk/serial_update build/flasher_l4.elf
      - name: Serial update blob header is current
        run: make -C sdk/serial_update check

      # core_nvm's flash emulation (sdk/core/core_nvm.c) on a simulated flash,
      # L4 and W5 geometry: random workloads, with a power cut at every erase
      # and every program unit. Host cc only, a few seconds.
      - name: core_nvm power-cut simulation
        run: make -C tests/host-nvm-sim

      # These take BLE_ENABLED from their config.json "ble" block, so they also
      # exercise the config-driven path Studio and the build service rely on.
      - name: Build the BLE projects
        run: |
          for p in ble-test ble-missing ble-beacon ble-contract val-ble val-ble-temp val-ble-scope; do
            echo "::group::$p"
            make -C "tests/$p"
            echo "::endgroup::"
          done

      # val-guard-ble is a NEGATIVE test: core_ble.h must #error on a Core with
      # no radio. If it ever compiles, the availability guard has broken.
      - name: val-guard-ble must NOT compile
        run: |
          if make -C tests/val-guard-ble > /tmp/guard.log 2>&1; then
            echo "::error::val-guard-ble compiled — the BLE availability guard is broken"
            exit 1
          fi
          grep -q 'BLE is only available on Core.ST.W5' /tmp/guard.log || {
            echo "::error::val-guard-ble failed, but not on the availability #error:"
            tail -20 /tmp/guard.log
            exit 1
          }
          echo "val-guard-ble correctly refused to compile."

  # Single required-check target: reports on every PR (unlike build/ble, which
  # skip when changes.outputs.run is false), so branch protection can require
  # just this one job and still auto-merge on green.
  firmware-ok:
    name: firmware-ok
    runs-on: ubuntu-latest
    needs: [changes, build, ble]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          set -euo pipefail
          results="${{ join(needs.*.result, ' ') }}"
          echo "job results: $results"
          for r in $results; do
            case "$r" in
              failure|cancelled)
                echo "::error::a required job did not succeed (result: $r)"
                exit 1
                ;;
            esac
          done
          echo "all required jobs succeeded or were correctly skipped."
