name: sync-definitions

# Mirror the canonical product DB's PUBLIC tiles (production, beta, obsolete)
# into definitions/, regenerate the derived manifests, and open a PR whenever
# either has drifted — so a DB rename/edit can
# never silently go stale in git, and the manifests the Studio palette / docs
# site vendor land in the SAME change as the definitions that drove them (the
# studio-manifest CI gate then passes on the PR instead of going red).
#
# Requires repo secret TILES_DB_PASSWORD (the product DB's read password).
# Host/user/db default to the library instance; override via TILES_DB_* if needed.

on:
  schedule:
    - cron: '17 6 * * *' # 06:17 UTC nightly
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Mint a tiles-sync App token: the default GITHUB_TOKEN is barred from
      # creating PRs ("GitHub Actions is not permitted to create or approve pull
      # requests"), but a GitHub App token is not — and the PRs land as the bot.
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.TILES_SYNC_APP_ID }}
          private-key: ${{ secrets.TILES_SYNC_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install mysql-connector-python

      - name: Mirror DB → definitions/
        env:
          TILES_DB_PASSWORD: ${{ secrets.TILES_DB_PASSWORD }}
        run: python3 tools/sync_definitions.py --apply

      - name: Regenerate derived manifests
        run: |
          python3 tools/gen_studio_manifest.py
          python3 tools/gen_tile_docs.py
          python3 tools/gen_reference_data.py

      - name: Open a PR if definitions or manifests drifted
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # The generators restamp `source: tiles@<sha>` into every manifest;
          # drop files whose ONLY change is that stamp so the PR shows just the
          # real definition + manifest drift (the studio-manifest gate ignores
          # the stamp, so reverting it here keeps the gate green either way).
          for f in $(git diff --name-only -- manifests/); do
            body="$(git diff -- "$f" | grep -E '^[+-]' | grep -vE '^[+-]{3} ' | grep -vE '"source": "tiles@' || true)"
            [ -z "$body" ] && git checkout -- "$f"
          done
          if git diff --quiet -- definitions/ manifests/; then
            echo "definitions/ and manifests/ already match the DB — nothing to sync."
            exit 0
          fi
          # ONE branch, reused. This used to embed ${{ github.run_id }}, which
          # made every nightly run open a brand new PR — so an unmerged sync was
          # re-proposed every night and the queue grew by one a day. Twenty
          # identical PRs had accumulated before anyone worked out they were the
          # same change. A fixed name means the open PR simply updates itself
          # and stays current with the DB until someone merges it.
          branch="auto/sync-definitions"
          git config user.name  "tiles-sync[bot]"
          git config user.email "tiles-sync@users.noreply.github.com"
          # Fetch it first so --force-with-lease has a remote-tracking ref to
          # compare against; without one it refuses rather than pushing, and a
          # fresh CI checkout has never seen this branch.
          git fetch origin "$branch" || true
          git checkout -B "$branch"
          git add definitions/ manifests/
          git commit -m "chore(definitions): sync from canonical product DB + regen manifests"
          git push -u --force-with-lease origin "$branch"
          # Already open? The push above has just refreshed it; say so and stop.
          existing="$(gh pr list --head "$branch" --state open --json number -q '.[0].number')"
          if [ -n "$existing" ]; then
            echo "Refreshed the open sync PR #$existing with the current DB state."
            exit 0
          fi
          gh pr create --fill \
            --title "chore(definitions): sync from canonical product DB" \
            --body "Automated drift sync from the product DB via \`tools/sync_definitions.py\`, with the derived manifests regenerated in the same change. Review the definition changes before merging — renames/deletes here ripple into coregen aliases, the Makefile, manifests, and the web mirrors. Pure \`source:\` stamp churn is dropped; once merged, notify-web-on-manifests re-vendors the manifests into the web repo."

  # Non-public tiles into the private overlay repos, routed by DB status
  # (tools/sync_definitions.py, "Private repos"): alpha -> tiles-alpha, dark ->
  # tile-<family>-<name>, design/concept/prototype/abandoned/none ->
  # tiles-internal. Pushed straight to each repo's main, one commit per changed
  # repo, as the bot. A separate job, so a private-repo problem never blocks
  # the public sync PR above; but a dark tile without its repo turns the run
  # red, after the other repos have been pushed. (The public mirror above
  # writes only public tiles, and removes any that stopped being public.)
  # When it pushed anything, it starts the bundle workflow, so the change
  # reaches Studio now rather than on the next tiles commit.
  private-definitions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # gh workflow run bundle.yml (a dispatch may start a run)
    steps:
      # Owner-scoped with no `repositories:`, so the token covers every repo
      # tile-json-sync is installed on: the overlays that exist today and any
      # tile-* repo created for a newly dark tile.
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.TILES_SYNC_APP_ID }}
          private-key: ${{ secrets.TILES_SYNC_APP_PRIVATE_KEY }}
          owner: bergsonnelabs

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install mysql-connector-python

      - name: Which private repos the DB needs
        env:
          TILES_DB_PASSWORD: ${{ secrets.TILES_DB_PASSWORD }}
        run: |
          python3 tools/sync_definitions.py --private-only \
            --private-repos-out "$RUNNER_TEMP/private-repos.txt"
          cat "$RUNNER_TEMP/private-repos.txt"

      - name: Clone them
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: tools/clone_private_repos.sh "$RUNNER_TEMP/private" "$RUNNER_TEMP/private-repos.txt"

      # Exit 3 = a tile's repo had no checkout (published nowhere). Carry on
      # to push the rest, and fail at the end.
      - name: Mirror non-public tiles into them
        id: mirror
        env:
          TILES_DB_PASSWORD: ${{ secrets.TILES_DB_PASSWORD }}
        run: |
          set +e
          python3 tools/sync_definitions.py --apply --private-only --private-root "$RUNNER_TEMP/private"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = 0 ] || [ "$code" = 3 ]

      - name: Push each changed repo to main
        id: push
        run: |
          set -euo pipefail
          pushed=false
          for dir in "$RUNNER_TEMP"/private/*/; do
            [ -d "$dir" ] || continue
            repo="$(basename "$dir")"
            git -C "$dir" add -A
            if git -C "$dir" diff --cached --quiet; then
              echo "$repo: already matches the DB."
              continue
            fi
            git -C "$dir" -c user.name="tiles-sync[bot]" \
              -c user.email="tiles-sync@users.noreply.github.com" \
              commit --quiet -m "chore(definitions): sync from canonical product DB (tiles@${GITHUB_SHA::7})"
            git -C "$dir" push --quiet origin HEAD:main
            echo "$repo: pushed $(git -C "$dir" rev-parse --short HEAD)"
            pushed=true
          done
          echo "pushed=$pushed" >> "$GITHUB_OUTPUT"

      # The bundle id includes each overlay's commit, so this publishes a new
      # bundle at the current tiles commit. GITHUB_TOKEN may start a
      # workflow_dispatch run (unlike a push); bundle.yml's concurrency group
      # queues it behind any publish already running.
      - name: Publish a new bundle
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bundle.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Fail on tiles with no private repo
        if: steps.mirror.outputs.code == '3'
        run: |
          echo "::error::A non-public tile has no private repo to go to, so it was published nowhere. See 'Mirror non-public tiles into them'; for a dark tile, create bergsonnelabs/tile-<family>-<name> and install tile-json-sync on it."
          exit 1

  # The public KiCad library (bergsonnelabs/bergsonne-kicad): regenerate its
  # symbols from the DB's production + beta tiles and open an auto-merging PR
  # there when they changed. A separate job, so a KiCad problem never blocks
  # the definitions sync above. It works from the DB's current definitions,
  # not tiles main, because the DB is canonical. Footprints are hand-drawn in
  # that repo and never touched here; its `library-ok` check (KiCad loads
  # both, pins match pads) gates the merge.
  kicad-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.TILES_SYNC_APP_ID }}
          private-key: ${{ secrets.TILES_SYNC_APP_PRIVATE_KEY }}
          owner: bergsonnelabs
          repositories: bergsonne-kicad

      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: bergsonnelabs/bergsonne-kicad
          token: ${{ steps.app-token.outputs.token }}
          path: kicad

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install mysql-connector-python

      # Status stays out of the (public) definition files; the generator gets
      # it from this side file.
      - name: DB → definitions/ + tile statuses
        env:
          TILES_DB_PASSWORD: ${{ secrets.TILES_DB_PASSWORD }}
        run: python3 tools/sync_definitions.py --apply --statuses-out "$RUNNER_TEMP/statuses.json"

      - name: Generate the symbol library
        run: |
          python3 tools/gen_kicad_lib.py \
            --statuses "$RUNNER_TEMP/statuses.json" --include production,beta \
            --footprints "kicad/Bergsonne Tiles.pretty" \
            --out "kicad/Bergsonne Tiles.kicad_sym"

      - name: Open an auto-merging PR if the symbols changed
        working-directory: kicad
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if git diff --quiet; then
            echo "Symbols already match the DB — nothing to sync."
            exit 0
          fi
          # One reused branch, as above: an unmerged sync updates itself.
          branch="auto/sync-symbols"
          git config user.name  "tiles-sync[bot]"
          git config user.email "tiles-sync@users.noreply.github.com"
          git fetch origin "$branch" || true
          git checkout -B "$branch"
          git commit -am "Regenerate tile symbols from the product DB (tiles@${GITHUB_SHA::7})"
          git push -u --force-with-lease origin "$branch"
          existing="$(gh pr list --head "$branch" --state open --json number -q '.[0].number')"
          if [ -z "$existing" ]; then
            gh pr create --base main --head "$branch" \
              --title "Regenerate tile symbols from the product DB" \
              --body "Automated by tiles' \`sync-definitions\` workflow (\`tools/gen_kicad_lib.py\`, production + beta tiles). Merges itself once \`library-ok\` passes."
          fi
          gh pr merge "$branch" --auto --merge
