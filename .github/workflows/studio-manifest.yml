name: studio-manifest

# Keeps the generated Studio / SDK-docs manifests honest: the parser's unit
# tests run, and `--check` fails the build if a header was edited without
# regenerating its manifest (drift). Provenance sha differences are ignored —
# see the --check normalisation in gen_studio_manifest.py.

on:
  pull_request:
    paths:
      - 'sdk/**'
      - 'drivers/**'
      - 'definitions/**'
      - 'manifests/**'
      - 'tools/gen_studio_manifest.py'
      - 'tools/test_gen_studio_manifest.py'
      - 'tools/check_status_consistency.py'
      - 'tools/gen_tile_docs.py'
      - 'tools/parse_driver_header.py'
      - 'tools/gen_reference_data.py'
      - 'tools/coreprobe_power.py'
      - 'tools/build_fingerprint.py'
      - 'tools/test_build_fingerprint.py'
      - 'tools/test_coreprobe_power.py'
      - '.github/workflows/studio-manifest.yml'
  push:
    branches: [main]

jobs:
  studio-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parser unit tests
        run: python3 tools/test_gen_studio_manifest.py
      - name: Build fingerprint unit tests
        run: python3 tools/test_build_fingerprint.py
      # Pure Python: hidapi is only imported when a probe is opened, so this
      # needs nothing installed. It pins the safety rules, including that the
      # host has no way to set a fixed level-shifter voltage.
      - name: CoreProbe power rules
        run: cd tools && python3 test_coreprobe_power.py
      - name: Manifests in sync with headers
        run: python3 tools/gen_studio_manifest.py --check
      - name: Status taxonomy consistency
        run: python3 tools/check_status_consistency.py
      - name: Tile-docs in sync with headers
        run: python3 tools/gen_tile_docs.py --check
      - name: Reference data in sync with definitions
        run: python3 tools/gen_reference_data.py --check
