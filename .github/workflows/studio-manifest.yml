name: studio-manifest

# Keeps the generated Studio / SDK-docs manifests honest: the parser's unit
# tests run, and `--check` fails the build if a header was edited without
# regenerating its manifest (drift). Provenance sha differences are ignored —
# see the --check normalisation in gen_studio_manifest.py.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Always reports (see design note below) so this workflow can be a required
  # check on every PR, even ones that don't touch manifest-affecting paths.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin "$BASE_REF"
          CHANGED="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          echo "Changed files:"
          echo "$CHANGED"

          # Faithful mirror of this workflow's old pull_request.paths filter.
          PATTERNS=(
            'sdk/**'
            'drivers/**'
            'definitions/**'
            'manifests/**'
            'tools/gen_studio_manifest.py'
            'tools/test_gen_studio_manifest.py'
            'tools/check_status_consistency.py'
            'tools/gen_tile_docs.py'
            'tools/parse_driver_header.py'
            'tools/gen_reference_data.py'
            'tools/coreprobe_power.py'
            'tools/build_fingerprint.py'
            'tools/test_build_fingerprint.py'
            'tools/test_coreprobe_power.py'
            '.github/workflows/studio-manifest.yml'
          )

          # Glob -> ERE: ** = any depth (incl. /), * = no slash, everything
          # else is escaped and matched literally.
          glob_to_regex() {
            local glob="$1" out="" i=0 c len=${#1}
            while [ "$i" -lt "$len" ]; do
              c="${glob:$i:1}"
              if [ "${glob:$i:2}" = "**" ]; then
                out+=".*"
                i=$((i + 2))
              elif [ "$c" = "*" ]; then
                out+="[^/]*"
                i=$((i + 1))
              else
                case "$c" in
                  '.') out+='\.' ;;
                  '['|']'|'('|')'|'{'|'}'|'^'|'$'|'|'|'\'|'+'|'?')
                    out+="\\$c" ;;
                  *) out+="$c" ;;
                esac
                i=$((i + 1))
              fi
            done
            printf '^%s$' "$out"
          }

          RUN=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            for pat in "${PATTERNS[@]}"; do
              regex="$(glob_to_regex "$pat")"
              if [[ "$file" =~ $regex ]]; then
                echo "match: $file  (pattern: $pat)"
                RUN=true
                break 2
              fi
            done
          done <<< "$CHANGED"

          echo "run=$RUN" >> "$GITHUB_OUTPUT"

  studio-manifest:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parser unit tests
        run: python3 tools/test_gen_studio_manifest.py
      - name: Build fingerprint unit tests
        run: python3 tools/test_build_fingerprint.py
      # Pure Python: hidapi is only imported when a probe is opened, so this
      # needs nothing installed. It pins the safety rules, including that the
      # host has no way to set a fixed level-shifter voltage.
      - name: CoreProbe power rules
        run: cd tools && python3 test_coreprobe_power.py
      - name: Manifests in sync with headers
        run: python3 tools/gen_studio_manifest.py --check
      - name: Status taxonomy consistency
        run: python3 tools/check_status_consistency.py
      - name: Tile-docs in sync with headers
        run: python3 tools/gen_tile_docs.py --check
      - name: Reference data in sync with definitions
        run: python3 tools/gen_reference_data.py --check

  # Single required-check target: reports on every PR (unlike studio-manifest,
  # which skips when changes.outputs.run is false), so branch protection can
  # require just this one job and still auto-merge on green.
  studio-manifest-ok:
    name: studio-manifest-ok
    runs-on: ubuntu-latest
    needs: [changes, studio-manifest]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          set -euo pipefail
          results="${{ join(needs.*.result, ' ') }}"
          echo "job results: $results"
          for r in $results; do
            case "$r" in
              failure|cancelled)
                echo "::error::a required job did not succeed (result: $r)"
                exit 1
                ;;
            esac
          done
          echo "all required jobs succeeded or were correctly skipped."
