name: bundle

# Publish the tiles bundle for every commit on main: each tile's manifest, docs,
# definitions and compiled twin, with an index carrying the twin contract
# version and the build fingerprint (twins/scripts/build-bundle.mjs,
# tools/build_fingerprint.py). Studio loads it at runtime through the site,
# which hands each viewer only the tiles they may see, so a driver, twin or
# docs change reaches Studio without a web deploy.
#
# Bundles are committed as `<sha>/…`, with `latest.json` pointing at the
# newest, and only the last 30 kept (git history holds the rest;
# twins/scripts/publish-bundle.sh). Two destinations for now:
#   - private-bundle: bergsonnelabs/tiles-bundles, branch main, built from
#     public definitions PLUS the private overlay repos (tiles-alpha,
#     tiles-internal, tile-*). This is where Studio reads from.
#   - bundle: this repo's `bundles` branch, from public definitions only, as
#     before. Goes away once non-public tiles have left this repo.
# A private definition change reaches tiles-bundles on the next tiles commit.
# (Not by re-running this: a bundle is keyed by the tiles sha, and the site
# caches `<sha>/…` for good, so a republish under the same sha would go unseen.)
#
# Then the build server: if this commit's fingerprint differs from the one the
# build server reports, what it compiles has changed, so web is asked to re-pin
# and redeploy it (web workflow `builder-repin`). A comment-only change, a twin,
# a doc: no redeploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bundle
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    outputs:
      fingerprint: ${{ steps.fp.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: twins/package-lock.json
      - name: Build fingerprint
        id: fp
        run: echo "fingerprint=$(python3 tools/build_fingerprint.py HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build the bundle
        working-directory: twins
        run: |
          npm ci
          npm run bundle -- --out "$RUNNER_TEMP/bundle" --sha "$GITHUB_SHA" \
            --fingerprint "${{ steps.fp.outputs.fingerprint }}"
      - name: Publish to the bundles branch
        run: |
          twins/scripts/publish-bundle.sh "$RUNNER_TEMP/bundle" \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            bundles "$GITHUB_SHA" "${{ steps.fp.outputs.fingerprint }}" \
            'github-actions[bot]' '41898282+github-actions[bot]@users.noreply.github.com'

  # The same bundle plus the private repos' definitions, to the private
  # tiles-bundles repo. Its own job so a private-repo problem can't hold up the
  # public bundle or the build server check.
  private-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: twins/package-lock.json
      # Owner-scoped with no `repositories:`: covers tiles-bundles and every
      # overlay repo tile-json-sync is installed on, including new tile-* ones.
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.TILES_SYNC_APP_ID }}
          private-key: ${{ secrets.TILES_SYNC_APP_PRIVATE_KEY }}
          owner: bergsonnelabs
      - name: Build fingerprint
        id: fp
        run: echo "fingerprint=$(python3 tools/build_fingerprint.py HEAD)" >> "$GITHUB_OUTPUT"
      - name: Clone the private overlays
        id: overlays
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          tools/clone_private_repos.sh "$RUNNER_TEMP/overlays"
          # Which overlay commits went in, for the commit message.
          revs="$(for d in "$RUNNER_TEMP"/overlays/*/; do
            [ -d "$d" ] && echo "$(basename "$d")@$(git -C "$d" rev-parse --short HEAD)"
          done | paste -sd, -)"
          echo "revs=$revs" >> "$GITHUB_OUTPUT"
      - name: Build the bundle (public + private definitions)
        working-directory: twins
        run: |
          npm ci
          overlays=()
          for d in "$RUNNER_TEMP"/overlays/*/; do
            [ -d "$d" ] && overlays+=(--overlay "$d")
          done
          npm run bundle -- --out "$RUNNER_TEMP/bundle" --sha "$GITHUB_SHA" \
            --fingerprint "${{ steps.fp.outputs.fingerprint }}" "${overlays[@]}"
      - name: Publish to tiles-bundles
        run: |
          twins/scripts/publish-bundle.sh "$RUNNER_TEMP/bundle" \
            "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/bergsonnelabs/tiles-bundles.git" \
            main "$GITHUB_SHA" "${{ steps.fp.outputs.fingerprint }}" \
            'tiles-sync[bot]' 'tiles-sync@users.noreply.github.com' \
            "[${{ steps.overlays.outputs.revs }}]"

  builder:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - name: Does the build server need this commit?
        id: check
        run: |
          deployed="$(curl -fsS --max-time 60 https://bergsonne-build.fly.dev/health | jq -r '.cores_fingerprint // empty' || true)"
          echo "deployed=${deployed:-unknown}, this commit=${{ needs.bundle.outputs.fingerprint }}"
          if [ "$deployed" = "${{ needs.bundle.outputs.fingerprint }}" ]; then
            echo "repin=false" >> "$GITHUB_OUTPUT"
          else
            echo "repin=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Mint a GitHub App token (scoped to web)
        if: steps.check.outputs.repin == 'true'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TILES_SYNC_APP_ID }}
          private-key: ${{ secrets.TILES_SYNC_APP_PRIVATE_KEY }}
          owner: bergsonnelabs
          repositories: web
      - name: Ask web to re-pin the build server
        if: steps.check.outputs.repin == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/bergsonnelabs/web/dispatches \
            -f event_type=builder-repin \
            -f 'client_payload[sha]=${{ github.sha }}' \
            -f 'client_payload[fingerprint]=${{ needs.bundle.outputs.fingerprint }}'
