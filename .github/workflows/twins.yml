name: twins

# Each tile's digital twin lives in twins/ next to its driver, and is held to the
# twin contract against the driver's generated manifest: call names, result
# shapes, pad keys, and every field a call writes or power / indicators / ticks
# read must exist in the twin's state. A driver change that breaks its twin
# fails here, in the same PR.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Always reports (see design note below) so this workflow can be a required
  # check on every PR, even ones that don't touch twin-affecting paths.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin "$BASE_REF"
          CHANGED="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          echo "Changed files:"
          echo "$CHANGED"

          # Faithful mirror of this workflow's old pull_request.paths filter.
          PATTERNS=(
            'twins/**'
            'manifests/**'
            'drivers/**'
            '.github/workflows/twins.yml'
          )

          # Glob -> ERE: ** = any depth (incl. /), * = no slash, everything
          # else is escaped and matched literally.
          glob_to_regex() {
            local glob="$1" out="" i=0 c len=${#1}
            while [ "$i" -lt "$len" ]; do
              c="${glob:$i:1}"
              if [ "${glob:$i:2}" = "**" ]; then
                out+=".*"
                i=$((i + 2))
              elif [ "$c" = "*" ]; then
                out+="[^/]*"
                i=$((i + 1))
              else
                case "$c" in
                  '.') out+='\.' ;;
                  '['|']'|'('|')'|'{'|'}'|'^'|'$'|'|'|'\'|'+'|'?')
                    out+="\\$c" ;;
                  *) out+="$c" ;;
                esac
                i=$((i + 1))
              fi
            done
            printf '^%s$' "$out"
          }

          RUN=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            for pat in "${PATTERNS[@]}"; do
              regex="$(glob_to_regex "$pat")"
              if [[ "$file" =~ $regex ]]; then
                echo "match: $file  (pattern: $pat)"
                RUN=true
                break 2
              fi
            done
          done <<< "$CHANGED"

          echo "run=$RUN" >> "$GITHUB_OUTPUT"

  twins:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: twins
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: twins/package-lock.json
      - run: npm ci
      - name: Typecheck (strict, no unused)
        run: npm run typecheck
      - name: Contract tests
        run: npm test

  # Single required-check target: reports on every PR (unlike twins, which
  # skips when changes.outputs.run is false), so branch protection can
  # require just this one job and still auto-merge on green.
  twins-ok:
    name: twins-ok
    runs-on: ubuntu-latest
    needs: [changes, twins]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          set -euo pipefail
          results="${{ join(needs.*.result, ' ') }}"
          echo "job results: $results"
          for r in $results; do
            case "$r" in
              failure|cancelled)
                echo "::error::a required job did not succeed (result: $r)"
                exit 1
                ;;
            esac
          done
          echo "all required jobs succeeded or were correctly skipped."
